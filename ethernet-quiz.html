<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ethernet Concepts Review Quiz</title>
<style>
  :root{
    --bg:#0f172a; --card:#ffffff; --text:#1e293b; --muted:#64748b;
    --accent:#2563eb; --good:#16a34a; --bad:#dc2626; --border:#e2e8f0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1120; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8;
      --accent:#60a5fa; --good:#4ade80; --bad:#f87171; --border:#334155;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; justify-content:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));
    padding-top:calc(24px + env(safe-area-inset-top,0px));
  }
  .wrap{width:100%; max-width:660px;}
  h1{font-size:1.4rem; margin:0 0 4px; text-align:center;}
  .sub{color:var(--muted); text-align:center; margin:0 0 20px; font-size:.9rem;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:22px; box-shadow:0 4px 16px rgba(0,0,0,.12);
  }
  .progress{display:flex; justify-content:space-between; font-size:.85rem; color:var(--muted); margin-bottom:10px;}
  .bar{height:6px; background:var(--border); border-radius:4px; overflow:hidden; margin-bottom:18px;}
  .bar-fill{height:100%; background:var(--accent); transition:width .3s;}
  .question{font-size:1.05rem; font-weight:600; margin-bottom:6px; line-height:1.4;}
  .exhibit{
    display:block; max-width:100%; height:auto; border-radius:10px;
    border:1px solid var(--border); margin-bottom:14px; background:#fff;
  }
  .hint{font-size:.8rem; color:var(--muted); margin:0 0 14px;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    display:flex; align-items:center; gap:10px; text-align:left;
    padding:12px 14px; border:1px solid var(--border); border-radius:10px;
    background:transparent; color:var(--text); font-size:.95rem; cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt.selected{border-color:var(--accent); background:rgba(37,99,235,.08);}
  .opt.correct{border-color:var(--good); background:rgba(22,163,74,.12);}
  .opt.incorrect{border-color:var(--bad); background:rgba(220,38,38,.12);}
  .opt.missed{border-color:var(--good); background:rgba(22,163,74,.06); box-shadow:inset 0 0 0 1px var(--good);}
  .opt:disabled{cursor:default;}
  .badge{width:22px; height:22px; border-radius:50%; border:2px solid var(--muted); flex:none;}
  .badge.sq{border-radius:5px;}
  .opt.correct .badge{border-color:var(--good); background:var(--good);}
  .opt.incorrect .badge{border-color:var(--bad); background:var(--bad);}
  .opt.selected .badge{border-color:var(--accent); background:var(--accent);}
  .verdict{
    display:none; align-items:center; gap:8px; margin-top:16px;
    padding:10px 14px; border-radius:10px; font-size:.95rem; font-weight:700;
  }
  .verdict.good{background:rgba(22,163,74,.14); color:var(--good);}
  .verdict.bad{background:rgba(220,38,38,.14); color:var(--bad);}
  .explain{
    margin-top:10px; padding:12px 14px; border-radius:10px; font-size:.88rem;
    background:rgba(100,116,139,.12); color:var(--text); display:none; line-height:1.5;
  }
  .actions{display:flex; justify-content:flex-end; margin-top:18px; gap:10px;}
  button.primary{
    background:var(--accent); color:#fff; border:none; padding:11px 22px;
    border-radius:9px; font-size:.95rem; font-weight:600; cursor:pointer;
  }
  button.primary:disabled{opacity:.4; cursor:not-allowed;}
  button.ghost{
    background:transparent; color:var(--muted); border:1px solid var(--border);
    padding:11px 18px; border-radius:9px; font-size:.9rem; cursor:pointer;
  }
  .result{text-align:center;}
  .score{font-size:2.6rem; font-weight:700; color:var(--accent); margin:10px 0;}
  .score-label{color:var(--muted); margin-bottom:20px;}
  .topics{font-size:.85rem; color:var(--muted); margin-top:6px;}
</style>
</head>
<body>

  <h1>Ethernet Concepts Review</h1>
  <p class="sub">CCNA1 &middot; Modules 4&ndash;7 Checkpoint Exam Practice &middot; 75 questions</p>
  <div class="card" id="card"></div>
</div>

const QUESTIONS = [
  {q:"What is the purpose of the OSI physical layer?", opts:["Controlling access to media","Transmitting bits across the local media","Performing error detection on received frames","Exchanging frames between nodes over physical network media"], correct:[1], exp:"The physical layer's job is to transport the bits that make up a frame across the network media, encoding a frame from the data link layer as a series of signals."},
  {q:"Why are two strands of fiber used for a single fiber optic connection?", opts:["The two strands allow the data to travel for longer distances without degrading.","They prevent crosstalk from causing interference on the connection.","They increase the speed at which the data can travel.","They allow for full-duplex connectivity."], correct:[3], exp:"One strand each direction lets a device transmit and receive at the same time — full-duplex connectivity."},
  {q:"Which characteristic describes crosstalk?", opts:["The distortion of the network signal from fluorescent lighting","The distortion of the transmitted messages from signals carried in adjacent wires","The weakening of the network signal over long cable lengths","The loss of wireless signal over excessive distance from the access point"], correct:[1], exp:"Crosstalk is a disturbance caused by the electric or magnetic field of a signal on one wire interfering with the signal in an adjacent wire."},
  {q:"Which procedure is used to reduce the effect of crosstalk in copper cables?", opts:["Requiring proper grounding connections","Twisting opposing circuit wire pairs together","Wrapping the bundle of wires with metallic shielding","Designing a cable infrastructure to avoid crosstalk interference","Avoiding sharp bends during installation"], correct:[1], exp:"Twisting opposing circuit wire pairs together cancels out interference between the pairs."},
  {q:"Match the situation: which network media is typically used for a horizontal cabling structure?", opts:["Copper Cables","Fiber Optic","Wireless"], correct:[0], exp:"Horizontal cabling structures typically use copper (UTP) cabling to connect wall jacks to the wiring closet."},
  {q:"Match the situation: which network media is typically used for desktop PCs in an enterprise office?", opts:["Copper Cables","Fiber Optic","Wireless"], correct:[0], exp:"Desktop PCs are commonly wired with copper cabling for reliable, low-cost connections."},
  {q:"Match the situation: which network media is typically used for backbone cabling in an enterprise?", opts:["Copper Cables","Fiber Optic","Wireless"], correct:[1], exp:"Fiber optic is used for backbone cabling because of its higher bandwidth and longer distance support."},
  {q:"Match the situation: which network media is typically used for long-haul networks?", opts:["Copper Cables","Fiber Optic","Wireless"], correct:[1], exp:"Fiber optic supports much greater distances than copper, making it ideal for long-haul links."},
  {q:"Match the situation: which network media is typically used for guest access in a coffee shop?", opts:["Copper Cables","Fiber Optic","Wireless"], correct:[2], exp:"Wireless media lets guests connect without needing a physical cable run."},
  {q:"Match the situation: which network media is typically used for waiting rooms in a hospital?", opts:["Copper Cables","Fiber Optic","Wireless"], correct:[2], exp:"Wireless is convenient for shared public spaces like waiting rooms."},
  {q:"Which three factors could influence differences between throughput and bandwidth on a company backbone? (Choose three.)", opts:["The amount of traffic that is currently crossing the network","The sophistication of the encapsulation method applied to the data","The type of traffic that is crossing the network","The latency created by the number of network devices the data is crossing","The bandwidth of the WAN connection to the Internet","The reliability of the gigabit Ethernet infrastructure of the backbone"], correct:[0,2,3], exp:"Throughput usually doesn't match the specified bandwidth due to the amount of traffic, type of traffic, and latency created by the devices the data crosses."},
  {q:"What are two characteristics of fiber-optic cable? (Choose two.)", opts:["It is not affected by EMI or RFI.","Each pair of cables is wrapped in metallic foil.","It combines the technique of cancellation, shielding, and twisting to protect data.","It typically contains 4 pairs of fiber-optic wires.","It is more expensive than UTP cabling is."], correct:[0,4], exp:"Fiber is immune to EMI and RFI, but it costs more and requires more skill and safety precautions to install than UTP."},
  {q:"With the use of unshielded twisted-pair copper wire, what causes crosstalk within the cable pairs?", opts:["The magnetic field around the adjacent pairs of wire","The use of braided wire to shield the adjacent wire pairs","The reflection of the electrical wave back from the far end of the cable","The collision caused by two nodes trying to use the media simultaneously"], correct:[0], exp:"Current flowing through a wire produces a magnetic field that interferes with the signal carried in an adjacent wire."},
  {q:"Refer to the graphic: a cable terminated with a connector featuring a metal ferrule, typically used for glass-strand links. What type of cabling is shown?", img:FIBER_IMG, opts:["STP","UTP","Coax","Fiber"], correct:[3], exp:"Fiber cable is a thin, transparent strand of glass surrounded by plastic insulation, terminated with connectors like this."},
  {q:"In addition to cable length, what two factors could interfere with communication carried over UTP cables? (Choose two.)", opts:["Crosstalk","Bandwidth","Size of the network","Signal modulation technique","Electromagnetic interference"], correct:[0,4], exp:"Copper media is susceptible to interference from EMI/RFI and from crosstalk between adjacent wire pairs."},
  {q:"Refer to the graphic: a cable end showing four twisted pairs of color-coded copper wires with no shielding. What type of cabling is shown?", img:UTP_IMG, opts:["STP","UTP","Coax","Fiber"], correct:[1], exp:"UTP cable consists of four pairs of color-coded wires twisted together and encased in a flexible plastic sheath, without shielding."},
  {q:"Which two devices commonly affect wireless networks? (Choose two.)", opts:["Blu-ray players","Home theaters","Cordless phones","Microwaves","Incandescent light bulbs","External hard drives"], correct:[2,3], exp:"Cordless phones and microwaves are common sources of RFI that interfere with wireless networks operating on similar frequencies."},
  {q:"Which two statements describe the services provided by the data link layer? (Choose two.)", opts:["It defines the end-to-end delivery addressing scheme.","It maintains the path between the source and destination devices during transmission.","It manages the access of frames to the network media.","It provides reliable delivery through link establishment and flow control.","It ensures that application data will be transmitted according to prioritization.","It packages various Layer 3 PDUs into a frame format compatible with the network interface."], correct:[2,5], exp:"The MAC sublayer manages access of frames to the media, and the LLC sublayer packages Layer 3 PDUs into a frame format compatible with the network interface."},
  {q:"What is the function of the CRC value found in the FCS field of a frame?", opts:["To verify the integrity of the received frame","To verify the physical address in the frame","To verify the logical address in the frame","To compute the checksum header for the data field in the frame"], correct:[0], exp:"The CRC value is compared against a recomputed CRC to verify the frame's integrity; mismatches cause the frame to be discarded."},
  {q:"What is contained in the trailer of a data-link frame?", opts:["Logical address","Physical address","Data","Error detection"], correct:[3], exp:"The trailer contains error-detection information (the FCS field) pertinent to the frame."},
  {q:"Which statement describes a characteristic of the frame header fields of the data link layer?", opts:["They all include the flow control and logical connection fields.","Ethernet frame header fields contain Layer 3 source and destination addresses.","They vary depending on protocols.","They include information on user applications."], correct:[2], exp:"The structure of the frame and its header fields vary according to which data link layer protocol is used."},
  {q:"A network team is comparing physical WAN topologies for connecting remote sites to headquarters. Which topology provides high availability and connects some, but not all, remote sites?", opts:["Mesh","Partial mesh","Hub and spoke","Point-to-point"], correct:[1], exp:"Partial mesh interconnects multiple remote sites for high availability without requiring every site to connect to every other site."},
  {q:"Which two fields or features does Ethernet examine to determine if a received frame is passed to the data link layer or discarded by the NIC? (Choose two.)", opts:["Auto-MDIX","CEF","Frame Check Sequence","Minimum frame size","Source MAC address"], correct:[2,3], exp:"A frame is discarded if it's smaller than the 64-byte minimum or if the calculated FCS doesn't match the received FCS."},
  {q:"Which media communication type does not require media arbitration in the data link layer?", opts:["Deterministic","Half-duplex","Full-duplex","Controlled access"], correct:[2], exp:"Full-duplex lets both devices transmit and receive simultaneously, so no arbitration for media access is needed."},
  {q:"Which statement describes an extended star topology?", opts:["End devices connect to a central intermediate device, which in turn connects to other central intermediate devices.","End devices are connected together by a bus and each bus connects to a central intermediate device.","Each end system is connected to its respective neighbor via an intermediate device.","All end and intermediate devices are connected in a chain to each other."], correct:[0], exp:"In an extended star topology, central intermediate devices interconnect other star topologies."},
  {q:"What is a characteristic of the LLC sublayer?", opts:["It provides the logical addressing required that identifies the device.","It provides delimitation of data according to the physical signaling requirements of the medium.","It places information in the frame allowing multiple Layer 3 protocols to use the same network interface and media.","It defines software processes that provide services to the physical layer."], correct:[2], exp:"LLC places information in the frame identifying which Layer 3 protocol is in use, letting protocols like IPv4 and IPv6 share the same interface and media."},
  {q:"What are three ways that media access control is used in networking? (Choose three.)", opts:["Ethernet utilizes CSMA/CD.","Media access control provides placement of data frames onto the media.","Contention-based access is also known as deterministic.","802.11 utilizes CSMA/CD.","Data link layer protocols define the rules for access to different media.","Networks with controlled access have reduced performance due to data collisions."], correct:[0,1,4], exp:"Wired Ethernet uses CSMA/CD; media access control governs how frames are placed on the media, and data link layer protocols define the access rules for each medium."},
  {q:"During the encapsulation process, what occurs at the data link layer for a PC connected to an Ethernet network?", opts:["An IP address is added.","The logical address is added.","The physical address is added.","The process port number is added."], correct:[2], exp:"The Ethernet frame includes the source and destination physical (MAC) address, added at the data link layer."},
  {q:"What three items are contained in an Ethernet header and trailer? (Choose three.)", opts:["Source IP address","Source MAC address","Destination IP address","Destination MAC address","Error-checking information"], correct:[1,3,4], exp:"Layer 2 headers/trailers contain source and destination MAC addresses plus error-checking (FCS) information — not IP addresses."},
  {q:"What type of communication rule would best describe CSMA/CD?", opts:["Access method","Flow control","Message encapsulation","Message encoding"], correct:[0], exp:"CSMA/CD is the access method rule dictating how an Ethernet device places a signal on the shared media."},
  {q:"Which three basic parts are common to all frame types supported by the data link layer? (Choose three.)", opts:["Header","Type field","MTU size","Data","Trailer","CRC value"], correct:[0,3,4], exp:"Every data link layer frame type has three basic parts: a header, data, and a trailer."},
  {q:"Which statement is true about the CSMA/CD access method used in Ethernet?", opts:["When a device hears a carrier signal and transmits, a collision cannot occur.","A jamming signal causes only devices that caused the collision to execute a backoff algorithm.","All network devices must listen before transmitting.","Devices involved in a collision get priority to transmit after the backoff period."], correct:[2], exp:"With CSMA/CD, every host listens to the medium to check whether it's busy before transmitting."},
  {q:"What is the auto-MDIX feature on a switch?", opts:["The automatic configuration of an interface for 10/100/1000 Mb/s operation","The automatic configuration of an interface for a straight-through or a crossover Ethernet cable connection","The automatic configuration of full-duplex operation over a single Ethernet copper or optical cable","The ability to turn a switch interface on or off accordingly if an active connection is detected"], correct:[1], exp:"Auto-MDIX lets a switch use either a crossover or straight-through cable, regardless of the device on the other end."},
  {q:"Refer to the exhibit: PC1 (192.168.1.50) connects through a switch to Router A (Fa0/0, 192.168.1.1), which links to Router B (Fa0/0, 192.168.5.1) connected through a switch to a Web Server (192.168.5.10). What is the destination MAC address of the frame as it leaves the web server if the final destination is PC1?", img:TOPOLOGY_IMG, opts:["00-60-2F-3A-07-AA","00-60-2F-3A-07-BB","00-60-2F-3A-07-CC","00-60-2F-3A-07-DD"], correct:[2], exp:"The MAC address changes at each segment; leaving the web server, the frame uses the MAC address of its default gateway, Router B's Fa0/0 (00-60-2F-3A-07-CC)."},
  {q:"A Layer 2 switch is used to switch incoming frames from a 1000BASE-T port to a port connected to a 100Base-T network. Which method of memory buffering would work best?", opts:["Port-based buffering","Level 1 cache buffering","Shared memory buffering","Fixed configuration buffering"], correct:[2], exp:"Shared memory buffering isn't restricted to a single port's buffer, which suits asymmetric switching between ports running at different speeds."},
  {q:"What are two examples of the cut-through switching method? (Choose two.)", opts:["Store-and-forward switching","Fast-forward switching","CRC switching","Fragment-free switching","QOS switching"], correct:[1,3], exp:"Fast-forward and fragment-free are both variations of cut-through switching, where the switch begins forwarding before the entire frame is received."},
  {q:"Which frame forwarding method receives the entire frame and performs a CRC check to detect errors before forwarding it?", opts:["Cut-through switching","Store-and-forward switching","Fragment-free switching","Fast-forward switching"], correct:[1], exp:"Store-and-forward accepts the whole frame and checks its CRC before forwarding it; fast-forward and fragment-free are cut-through variants."},
  {q:"What is the purpose of the FCS field in a frame?", opts:["To obtain the MAC address of the sending node","To verify the logical address of the sending node","To compute the CRC header for the data field","To determine if errors occurred in the transmission and reception"], correct:[3], exp:"The FCS field is used to detect transmission/reception errors by comparing computed and received CRC values."},
  {q:"Which switching method has the lowest level of latency?", opts:["Cut-through","Store-and-forward","Fragment-free","Fast-forward"], correct:[3], exp:"Fast-forward switching forwards immediately after reading the destination MAC address, giving the lowest latency."},
  {q:"A network administrator is connecting two modern switches using a straight-through cable, both new and unconfigured. Which three statements are correct about the final result? (Choose three.)", opts:["The link between the switches will work at the fastest speed supported by both switches.","The link between switches will work as full-duplex.","If both switches support different speeds, they will each work at their own fastest speed.","The auto-MDIX feature will configure the interfaces, eliminating the need for a crossover cable.","The connection will not be possible unless the administrator changes the cable to a crossover cable.","The duplex capability has to be manually configured because it cannot be negotiated."], correct:[0,1,3], exp:"Modern switches negotiate full-duplex at the fastest common speed, and auto-MDIX (enabled by default) means a crossover cable isn't needed."},
  {q:"Which advantage does the store-and-forward switching method have compared with the cut-through switching method?", opts:["Collision detecting","Frame error checking","Faster frame forwarding","Frame forwarding using IPv4 Layer 3 and 4 information"], correct:[1], exp:"Store-and-forward performs an error check on the incoming frame using its FCS/CRC value before forwarding it."},
  {q:"When the store-and-forward method of switching is in use, what part of the Ethernet frame is used to perform an error check?", opts:["CRC in the trailer","Source MAC address in the header","Destination MAC address in the header","Protocol type in the header"], correct:[0], exp:"The CRC in the trailer is used to determine whether the frame was modified during transit."},
  {q:"Which switching method uses the CRC value in a frame?", opts:["Cut-through","Fast-forward","Fragment-free","Store-and-forward"], correct:[3], exp:"Store-and-forward switching receives the complete frame and uses the CRC in the trailer to check for modification during transit."},
  {q:"What are two actions performed by a Cisco switch? (Choose two.)", opts:["Building a routing table based on the first IP address in the frame header","Using the source MAC addresses of frames to build and maintain a MAC address table","Forwarding frames with unknown destination IP addresses to the default gateway","Utilizing the MAC address table to forward frames via the destination MAC address","Examining the destination MAC address to add new entries to the MAC address table"], correct:[1,3], exp:"A switch learns source MAC addresses to build its MAC table and uses that table's destination MAC entries to decide where to forward frames."},
  {q:"Which two statements describe features or functions of the logical link control sublayer in Ethernet standards? (Choose two.)", opts:["Logical link control is implemented in software.","Logical link control is specified in the IEEE 802.3 standard.","The LLC sublayer adds a header and a trailer to the data.","The data link layer uses LLC to communicate with the upper layers of the protocol suite.","The LLC sublayer is responsible for the placement and retrieval of frames on and off the media."], correct:[0,3], exp:"LLC is implemented entirely in software (specified in IEEE 802.2) and lets the data link layer communicate with upper-layer protocols."},
  {q:"What is the auto-MDIX feature?", opts:["It enables a device to automatically configure an interface to use a straight-through or a crossover cable.","It enables a device to automatically configure the duplex settings of a segment.","It enables a device to automatically configure the speed of its interface.","It enables a switch to dynamically select the forwarding method."], correct:[0], exp:"Auto-MDIX configures a port according to the cable type used and the device on the other end, so straight-through and crossover cables both work."},
  {q:"What is one advantage of using the cut-through switching method instead of the store-and-forward switching method?", opts:["Has a positive impact on bandwidth by dropping most of the invalid frames","Makes a fast forwarding decision based on the source MAC address of the frame","Has a lower latency appropriate for high-performance computing applications","Provides the flexibility to support any mix of Ethernet speeds"], correct:[2], exp:"Cut-through switching offers lower latency, suited to high-performance computing, but allows more invalid frames through than store-and-forward."},
  {q:"Which is a multicast MAC address?", opts:["FF-FF-FF-FF-FF-FF","5C-26-0A-4B-19-3E","01-00-5E-00-00-03","00-26-0F-4B-00-3E"], correct:[2], exp:"Multicast MAC addresses begin with the special value 01-00-5E."},
  {q:"Refer to the exhibit: an RJ-45 connector termination showing the wires untwisted for a long section before entering the plug. What is wrong with the displayed termination?", img:RJ45_BAD_IMG, opts:["The woven copper braid should not have been removed.","The wrong type of connector is being used.","The untwisted length of each wire is too long.","The wires are too thick for the connector that is used."], correct:[2], exp:"When terminating an RJ-45 connector, the untwisted length of each wire should be kept short — none of the colored wires should show below the jack."},
  {q:"Refer to the exhibit: a PC connects to a switch's console port (1), the switch connects to a router (2), and that router connects to a second router (3); all other links are FastEthernet. Which types of UTP cables can be used to connect these devices?", img:CABLE_TYPES_IMG, opts:["1 - rollover, 2 - crossover, 3 - straight-through","1 - rollover, 2 - straight-through, 3 - crossover","1 - crossover, 2 - rollover, 3 - straight-through","1 - crossover, 2 - straight-through, 3 - rollover"], correct:[1], exp:"A rollover cable connects to a console port, a straight-through cable connects a switch to a router, and a crossover cable connects two like devices such as router to router."},
  {q:"Packet Tracer: Six PCs connect to Switch0. After pinging from PC0 to the host with IPv4 address 10.1.1.5, which port does Switch0 use to send frames to that host?", img:PT_TOPOLOGY_IMG, opts:["Fa0/1","Fa0/5","Fa0/9","Fa0/11"], correct:[3], exp:"The switch learns MAC-to-port mappings from the source addresses of frames it receives; the MAC address table shows which port maps to the destination host's MAC."},
  {q:"What does the term 'attenuation' mean in data communication?", opts:["Loss of signal strength as distance increases","Time for a signal to reach its destination","Leakage of signals from one cable pair to another","Strengthening of a signal by a networking device"], correct:[0], exp:"Attenuation is the deterioration/loss of signal strength the farther it travels on copper media."},
  {q:"What are three reasons fiber is preferable to copper cabling for interconnecting buildings? (Choose three.)", opts:["Greater distances per cable run","Lower installation cost","Limited susceptibility to EMI/RFI","Durable connections","Greater bandwidth potential","Easily terminated"], correct:[0,2,4], exp:"Fiber transmits data over longer distances and at higher bandwidths than copper, and is largely immune to EMI/RFI — though it costs more and is harder to terminate."},
  {q:"What OSI physical layer term describes the process by which one wave modifies another wave?", opts:["Modulation","IEEE","EIA/TIA","Air"], correct:[0], exp:"Modulation is where a data signal modifies a characteristic (amplitude, frequency, or phase) of a higher-frequency carrier wave, letting digital data travel over analog media."},
  {q:"What OSI physical layer term describes the capacity at which a medium can carry data?", opts:["Bandwidth","IEEE","EIA/TIA","Air"], correct:[0], exp:"Bandwidth is the maximum theoretical capacity of a medium to carry data, typically measured in bps/Mbps/Gbps."},
  {q:"What OSI physical layer term describes the measure of the transfer of bits across a medium over a given period of time?", opts:["Throughput","Bandwidth","Latency","Goodput"], correct:[0], exp:"Throughput is the actual, real-world measure of bits transferred across media, usually lower than bandwidth due to congestion, latency, and protocol overhead."},
  {q:"What OSI physical layer term describes the amount of time, including delays, for data to travel from one point to another?", opts:["Latency","Bandwidth","Throughput","Goodput"], correct:[0], exp:"Latency is the total time — propagation plus processing and queuing delays — for data to travel between two points."},
  {q:"What OSI physical layer term describes the amount of time, including delays, for data to travel from one point to another? (Variant)", opts:["Latency","Fiber-optic cable","Air","Copper cable"], correct:[0], exp:"Latency encompasses propagation delay plus processing and queuing delays across a network path."},
  {q:"What OSI physical layer term describes the measure of usable data transferred over a given period of time?", opts:["Goodput","Fiber-optic cable","Air","Copper cable"], correct:[0], exp:"Goodput measures only the useful application payload delivered, filtering out protocol overhead — it's always lower than throughput."},
  {q:"What OSI physical layer term describes the physical medium which uses electrical pulses?", opts:["Copper cable","Fiber-optic cable","Air","Goodput"], correct:[0], exp:"Copper cable relies on electrical pulses to transmit binary data and is susceptible to attenuation, EMI, and crosstalk."},
  {q:"What OSI physical layer term describes the physical medium that uses the propagation of light?", opts:["Fiber-optic cable","Goodput","Latency","Throughput"], correct:[0], exp:"Fiber-optic cable uses modulated light pulses to transmit data and is immune to EMI/RFI."},
  {q:"What OSI physical layer term describes the physical medium for microwave transmissions?", opts:["Air","Goodput","Latency","Throughput"], correct:[0], exp:"Air serves as the transmission channel for wireless/microwave signals traveling between antennas."},
  {q:"Which two functions are performed at the MAC sublayer of the OSI data link layer? (Choose two.)", opts:["Adds Layer 2 control information to network protocol data.","Places information in the frame that identifies which network layer protocol is being used for the frame.","Controls the NIC responsible for sending and receiving data on the physical medium.","Implements a trailer to detect transmission errors.","Enables IPv4 and IPv6 to utilize the same network interface and media."], correct:[2,3], exp:"MAC handles synchronization, media access (controlling the NIC), and error detection (implementing the FCS trailer). Protocol identification and multi-protocol sharing are LLC functions."},
  {q:"Which two functions are performed at the LLC sublayer of the OSI data link layer?", opts:["Enables IPv4 and IPv6 to utilize the same network interface and media.","Places information in the frame that identifies which network layer protocol is being used for the frame.","Integrates various physical technologies.","Implements a process to delimit fields within a Layer 2 frame.","Controls the NIC responsible for sending and receiving data on the physical medium."], correct:[0,1], exp:"LLC identifies the Layer 3 protocol in the frame, letting protocols like IPv4 and IPv6 share the same interface and media."},
  {q:"Which two functions are performed at the LLC sublayer of the OSI data link layer? (Variant)", opts:["Adds Layer 2 control information to network protocol data.","Places information in the frame that identifies which network layer protocol is being used for the frame.","Performs data encapsulation.","Controls the NIC responsible for sending and receiving data on the physical medium.","Integrates various physical technologies."], correct:[0,1], exp:"LLC adds Layer 2 control information to the PDU before handing it to MAC, and identifies which Layer 3 protocol the frame carries."},
  {q:"Which two functions are performed at the LLC sublayer of the OSI data link layer? (Variant)", opts:["Adds Layer 2 control information to network protocol data.","Enables IPv4 and IPv6 to utilize the same network interface and media.","Provides data link layer addressing.","Implements a trailer to detect transmission errors.","Provides synchronization between source and target nodes."], correct:[0,1], exp:"LLC adds Layer 2 control information to network protocol PDUs and enables multiple Layer 3 protocols like IPv4/IPv6 to share the same interface and media."},
  {q:"Which two functions are performed at the LLC sublayer of the OSI data link layer? (Variant)", opts:["Enables IPv4 and IPv6 to utilize the same network interface and media.","Adds Layer 2 control information to network protocol data.","Integrates various physical technologies.","Implements a trailer to detect transmission errors.","Provides synchronization between source and target nodes."], correct:[0,1], exp:"LLC enables multiple Layer 3 protocols to share the interface and media, and adds Layer 2 control information before handing the PDU to MAC."},
  {q:"What action will occur if a switch receives a frame with the destination MAC address FF:FF:FF:FF:FF:FF?", opts:["The switch forwards it out all ports except the ingress port.","The switch refreshes the timer on that entry.","The switch does not forward the frame.","The switch sends the frame to a connected router because the destination MAC address is not local."], correct:[0], exp:"FF:FF:FF:FF:FF:FF is the Layer 2 broadcast address; a switch floods it out all active ports in the broadcast domain except the port it arrived on."},
  {q:"What action will occur if a switch receives a frame with the destination MAC address 01:00:5E:00:00:D9?", opts:["The switch forwards it out all ports except the ingress port.","The switch does not forward the frame.","The switch sends the frame to a connected router because the destination MAC address is not local.","The switch shares the MAC address table entry with any connected switches."], correct:[0], exp:"This is an IPv4 multicast MAC address (01-00-5E prefix); without multicast filtering configured, a switch floods it out all ports except the ingress port, similar to a broadcast."},
  {q:"What action will occur if a host receives a frame with a destination MAC address of FF:FF:FF:FF:FF:FF?", opts:["The host will process the frame.","The host forwards the frame to the router.","The host sends the frame to the switch to update the MAC address table.","The host forwards the frame to all other hosts."], correct:[0], exp:"A host recognizes the broadcast address as intended for it and hands the frame up the protocol stack for processing."},
  {q:"What action will occur if a switch receives a frame and does have the source MAC address in the MAC table?", opts:["The switch refreshes the timer on that entry.","The switch adds it to its MAC address table associated with the port number.","The switch forwards the frame to the associated port.","The switch sends the frame to a connected router because the destination MAC address is not local."], correct:[0], exp:"If the source MAC is already in the table for that port, the switch simply refreshes the aging timer rather than creating a duplicate entry."},
  {q:"What action will occur if a host receives a frame with a destination MAC address of FF:FF:FF:FF:FF:FF? (Variant)", opts:["The host will process the frame.","The host returns the frame to the switch.","The host replies to the switch with its own IP address.","The host forwards the frame to all other hosts."], correct:[0], exp:"The broadcast address tells the host's NIC the frame is meant for every device on the segment, so it accepts and processes it."},
  {q:"What action will occur if a host receives a frame with a destination MAC address it does not recognize?", opts:["The host will discard the frame.","The host replies to the switch with its own IP address.","The host forwards the frame to all other hosts.","The host returns the frame to the switch."], correct:[0], exp:"A host only accepts frames matching its own MAC, a broadcast address, or a subscribed multicast address; the NIC drops anything else."},
  {q:"Which type of UTP cable is used to connect a PC to a switch port?", opts:["Console","Rollover","Crossover","Straight-through"], correct:[3], exp:"A straight-through (patch) cable is used to connect a host to a switch, and a switch to a router."},
];

let idx = 0, score = 0, answered = false, selected = [];
const card = document.getElementById('card');

function render(){
  if (idx >= QUESTIONS.length) return renderResult();
  const item = QUESTIONS[idx];
  answered = false;
  selected = [];
  const isMulti = item.correct.length > 1;
  const pct = Math.round((idx / QUESTIONS.length) * 100);
  card.innerHTML = `
    <div class="progress">
      <span>Question ${idx+1} of ${QUESTIONS.length}</span>
      <span class="progress-right">Score: ${score} &nbsp; <button class="linkbtn" id="restartTopBtn">Restart quiz</button></span>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="question">${item.q}</div>
    ${item.img ? `<img class="exhibit" src="${item.img}" alt="Exhibit for this question">` : ''}
    <div class="hint">${isMulti ? `Select ${item.correct.length} answers, then submit.` : 'Select an answer, then submit.'}</div>
    <div class="options" id="opts"></div>
    <div class="verdict" id="verdict"></div>
    <div class="explain" id="explain"></div>
    <div class="actions">
      <button class="ghost" id="redoBtn" style="display:none;">Redo this question</button>
      <button class="primary" id="submitBtn" disabled>Submit</button>
    </div>`;
  const optsEl = document.getElementById('opts');
  item.opts.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="badge${isMulti ? ' sq' : ''}"></span><span>${text}</span>`;
    btn.onclick = () => toggleAnswer(i, btn, isMulti);
    optsEl.appendChild(btn);
  });
  document.getElementById('restartTopBtn').onclick = restartQuiz;
}

function restartQuiz(){
  idx = 0;
  score = 0;
  render();
}

function toggleAnswer(i, btn, isMulti){
  if (answered) return;
  const item = QUESTIONS[idx];
  if (isMulti){
    const pos = selected.indexOf(i);
    if (pos === -1){
      if (selected.length >= item.correct.length) return;
      selected.push(i);
      btn.classList.add('selected');
    } else {
      selected.splice(pos, 1);
      btn.classList.remove('selected');
    }
  } else {
    selected = [i];
    document.querySelectorAll('.opt').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = selected.length !== item.correct.length;
  submitBtn.onclick = submitAnswer;
}

function submitAnswer(){
  if (answered) return;
  answered = true;
  const item = QUESTIONS[idx];
  const allBtns = document.querySelectorAll('.opt');
  const correctSet = item.correct;
  const isCorrect = selected.length === correctSet.length && selected.every(s => correctSet.includes(s));
  allBtns.forEach((b, j) => {
    b.disabled = true;
    b.classList.remove('selected');
    if (correctSet.includes(j) && selected.includes(j)) b.classList.add('correct');
    else if (correctSet.includes(j)) b.classList.add('missed');
    else if (selected.includes(j)) b.classList.add('incorrect');
  });
  if (isCorrect) score++;
  lastAnswerCorrect = isCorrect;
  const verdict = document.getElementById('verdict');
  verdict.style.display = 'flex';
  verdict.className = 'verdict ' + (isCorrect ? 'good' : 'bad');
  verdict.textContent = isCorrect ? '✓ Correct!' : '✗ Not quite — correct answer' + (correctSet.length > 1 ? 's are' : ' is') + ' marked in green.';
  const exp = document.getElementById('explain');
  exp.style.display = 'block';
  exp.textContent = item.exp;
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.textContent = 'Next';
  submitBtn.disabled = false;
  submitBtn.onclick = () => { idx++; render(); };
  const redoBtn = document.getElementById('redoBtn');
  redoBtn.style.display = 'inline-block';
  redoBtn.onclick = redoQuestion;
}

function redoQuestion(){
  if (lastAnswerCorrect) score--;
  render();
}

function renderResult(){
  const pct = Math.round((score / QUESTIONS.length) * 100);
  card.innerHTML = `
    <div class="result">
      <div class="score-label">Quiz complete</div>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="score-label">${pct}% correct</div>
      <div class="actions" style="justify-content:center;">
        <button class="primary" id="restartBtn">Retake Quiz</button>
      </div>
      <div class="topics">Covers OSI Physical &amp; Data Link layers, cabling, crosstalk, switching methods, MAC/LLC sublayers, and Ethernet framing (CCNA1 Modules 4&ndash;7).</div>
    </div>`;
  document.getElementById('restartBtn').onclick = () => { idx = 0; score = 0; render(); };
}

render();
</script>
